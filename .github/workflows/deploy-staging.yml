name: Deploy to docs-content.oniudra.cc

on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: true

# Allow installation of dependencies
permissions:
  id-token: write
  contents: read

jobs:
  render-datasheets:
    name: Render Datasheets
    uses: ./.github/workflows/_render-datasheets.yml

  build:
    name: Build and Deploy
    needs: render-datasheets
    runs-on: docs-ubuntu-8core
    environment: staging
    timeout-minutes: 150
    if: github.repository == 'arduino/docs-content'
    env:
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      APP_ENV: staging

    steps:
      # fetch-depth: 0 is required by gatsby-transformer-gitinfo, which runs
      # `git log -n 1 -- <file>` on every content file to populate
      # gitLogLatestDate (the "last updated" date shown on tutorial pages).
      # filter: blob:none still fetches every commit and every tree - so that
      # git log keeps resolving locally - while skipping historical blob
      # contents, which are the bulk of this repo's ~11 GB of git history.
      # Do NOT swap this for fetch-depth: 1: it would blank out gitLogLatestDate.
      # Checkout stalls intermittently on this repo (~9 GB): on 2026-08-25, 4 of
      # 8 checkouts hung with no progress at all. Bound the attempt and retry
      # once, instead of letting a stalled transfer run into the 6h default.
      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: "0"
          filter: blob:none

      # A checkout killed by the timeout leaves a partial clone behind (and
      # sometimes a stale index.lock): wiping the workspace makes the second
      # attempt genuinely independent of the first.
      - name: Reset workspace before checkout retry
        if: steps.checkout.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: "0"
          filter: blob:none

      # Attempt 2 has failed outright before, not only stalled: one more wipe and a last try, bounded by the job timeout
      - name: Reset workspace before last checkout attempt
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        with:
          fetch-depth: "0"
          filter: blob:none

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Retrieve Datasheets
        uses: actions/download-artifact@v8 # Retrieve the datasheets generated in the previous job
        with:
          name: datasheets
          path: static/resources/datasheets

      - name: Debug datasheet list
        run: ls -lah static/resources/datasheets

      - name: Copy Static Files
        uses: ./.github/actions/copy-static-files

      - name: Check for large files
        uses: ./.github/actions/check-large-files

      - name: Compress Large Images
        uses: ./.github/actions/compress-images

      - name: Restore Gatsby cache
        uses: ./.github/actions/restore-gatsby-cache

      - run: npm install --prefer-offline --no-audit --fund=false

      # nproc and free tell us whether logical_cores actually doubled the workers, and how much headroom they have
      - name: Runner capacity
        run: |
          echo "vCPU: $(nproc)"
          free -g

      - name: Build
        run: npm run build
        env:
          # Gatsby defaults to physical cores, which is half the vCPUs of a runner
          GATSBY_CPU_COUNT: logical_cores
          ALGOLIA_INDEXER_KEY: ${{ secrets.ALGOLIA_INDEXER_KEY }}

      - name: Clean up node_modules # Just to save space
        run: rm -rf node_modules

      - name: Deploy to S3
        uses: ./.github/actions/sync-s3
        with:
          role-to-assume: ${{ secrets.STAGING_IAM_ROLE }}
          bucket-name: ${{ secrets.STAGING_BUCKET_NAME }}

  purge-datasheets:
    name: Purge Datasheets cache
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 10
    steps:
      - name: Purge Cloudflare Cache
        shell: bash
        run: |
          echo "Purging Cloudflare cache for prefix: ${{ vars.DATASHEETS_BASE_URL }}, zone: ${{ vars.CLOUDFLARE_ZONE }}"
          curl -f -X POST "https://api.cloudflare.com/client/v4/zones/${{ vars.CLOUDFLARE_ZONE }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"prefixes":["${{ vars.DATASHEETS_BASE_URL }}"]}'
