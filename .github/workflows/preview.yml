name: Preview Deployment

on:
  pull_request:
    types: [labeled, synchronize]

# Keyed on the label: pushes and other labels must not cancel a running preview
concurrency:
  group: netlify-${{ github.workflow }}-${{ github.ref }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  # A new push drops the label, so a preview only runs when the label is added again
  remove-label:
    name: Remove Preview Label
    # Fork PRs get a read-only token, and previews never run there anyway
    if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'preview') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label preview
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}

  # This job is used to render datasheets, but only if they have changed.
  # It's a separate job so we don't have to cleanup the machine afterwards.
  render-datasheets:
    name: Render Datasheets
    if: ${{ github.event.label.name == 'preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Checkout stalls intermittently on this repo (~9 GB): on 2026-08-25, 4 of
      # 8 checkouts hung with no progress at all. Bound the attempt and retry
      # once, instead of letting a stalled transfer run into the 6h default.
      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # A checkout killed by the timeout leaves a partial clone behind (and
      # sometimes a stale index.lock): wiping the workspace makes the second
      # attempt genuinely independent of the first.
      - name: Reset workspace before checkout retry
        if: steps.checkout.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # Attempt 2 has failed outright before, not only stalled: one more wipe and a last try, bounded by the job timeout
      - name: Reset workspace before last checkout attempt
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        with:
          fetch-depth: 1

      - uses: ./.github/actions/generate-datasheets
        with:
          artifact-name: datasheets
          datasheets-path: static/resources/datasheets

  preview-build:
    if: ${{ github.event.label.name == 'preview' }}
    runs-on: docs-ubuntu-8core
    needs: render-datasheets
    timeout-minutes: 150
    concurrency:
      group: netlify
      cancel-in-progress: false
    env:
      REPO_ACCESS_TOKEN: ${{ secrets.REPO_ACCESS_TOKEN }}
      APP_ENV: staging
      BRANCH_NAME: ${{ github.ref_name }}

    steps:

      - name: Find PR Preview Comment
        uses: peter-evans/find-comment@v4
        id: deploy-preview-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: "github-actions[bot]"
          body-includes: "Preview Deployment"

      - name: Update Comment if exists
        if: steps.deploy-preview-comment.outputs.comment-id != 0
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.deploy-preview-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Preview Deployment
            Waiting for deployment to complete...

      # Checkout stalls intermittently on this repo (~9 GB): on 2026-08-25, 4 of
      # 8 checkouts hung with no progress at all. Bound the attempt and retry
      # once, instead of letting a stalled transfer run into the 6h default.
      - uses: actions/checkout@v5
        id: checkout
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # A checkout killed by the timeout leaves a partial clone behind (and
      # sometimes a stale index.lock): wiping the workspace makes the second
      # attempt genuinely independent of the first.
      - name: Reset workspace before checkout retry
        if: steps.checkout.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        id: checkout-retry
        if: steps.checkout.outcome == 'failure'
        continue-on-error: true
        timeout-minutes: 5
        with:
          fetch-depth: 1

      # Attempt 2 has failed outright before, not only stalled: one more wipe and a last try, bounded by the job timeout
      - name: Reset workspace before last checkout attempt
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        run: |
          shopt -s dotglob
          rm -rf "${GITHUB_WORKSPACE:?}"/*

      - uses: actions/checkout@v5
        if: steps.checkout.outcome == 'failure' && steps.checkout-retry.outcome == 'failure'
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      - name: Retrieve Datasheets
        uses: actions/download-artifact@v8
        with:
          name: datasheets
          path: static/resources/datasheets

      - name: Copy Static Files
        run: |
          mkdir -p static/resources/datasheets static/resources/schematics static/resources/pinouts static/resources/models
          find ./content/hardware -type f -name "*-schematics.pdf" -exec cp {} ./static/resources/schematics/ \;
          find ./content/hardware -type f -name "*-datasheet.pdf" -exec cp {} ./static/resources/datasheets/ \;
          find ./content/hardware -type f -name "*-full-pinout.pdf" -exec cp {} ./static/resources/pinouts/ \;
          find ./content/hardware -type f -name "*-pinout.png" -exec cp {} ./static/resources/pinouts/ \;
          find ./content/hardware -type f -name "*-step.zip" -exec cp {} ./static/resources/models/ \;

      # Key on the git blob hash of each file, not its size: two different images of equal weight would share a key
      - name: Compressed images key
        id: images-key
        run: |
          find content -type f \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -size +2M -print0 > /tmp/big-images.lst
          xargs -0 -r git ls-files -s -- < /tmp/big-images.lst > /tmp/big-images.idx
          # An untracked image would be compressed but absent from the key, so require one index line per file found
          test "$(tr -dc '\0' < /tmp/big-images.lst | wc -c)" -eq "$(wc -l < /tmp/big-images.idx)"
          echo "hash=$(sort /tmp/big-images.idx | sha256sum | cut -c1-40)" >> "$GITHUB_OUTPUT"

      - name: Compressed images cache
        uses: actions/cache@v5
        with:
          path: /tmp/compressed-images.tar
          key: ${{ runner.os }}-compressed-images-${{ steps.images-key.outputs.hash }}

      - name: Compress Large Images
        run: |
          # jpegoptim and optipng are deterministic, so a hit means the same bytes without spending ~9 min again
          if [ -f /tmp/compressed-images.tar ]; then
            echo "Restoring images compressed by an earlier run..."
            tar xf /tmp/compressed-images.tar
            exit 0
          fi
          sudo apt-get update && sudo apt-get install -y jpegoptim optipng
          # A missing compressor is a systemic failure and must stop the job, unlike the per-file errors tolerated below
          command -v jpegoptim > /dev/null && command -v optipng > /dev/null
          # -exec ... \; spawns one process per file on a single core: xargs -P "$(nproc)" spreads the same work over every core
          find content -type f \( -name "*.jpg" -o -name "*.jpeg" \) -size +2M -print0 > /tmp/big-jpg.lst
          find content -type f -name "*.png" -size +2M -print0 > /tmp/big-png.lst
          # find -exec ignored the exit status of each command, xargs reports 123 if any file fails: a few .png are really JPEGs
          echo "Compressing large JPGs..."
          xargs -0 -r -P "$(nproc)" -n 1 jpegoptim --strip-all < /tmp/big-jpg.lst || echo "Some JPGs could not be optimized, continuing"
          echo "Compressing large PNGs..."
          xargs -0 -r -P "$(nproc)" -n 1 optipng -o2 < /tmp/big-png.lst || echo "Some PNGs could not be optimized, continuing"
          # The list is captured before compressing: some files drop under 2M and find would no longer report them
          cat /tmp/big-jpg.lst /tmp/big-png.lst | tar --null -cf /tmp/compressed-images.tar -T -

      # Restore only: production on main is the single writer, so a PR cannot evict the entry every PR reads
      - name: Gatsby main cache
        uses: actions/cache/restore@v5
        id: gatsby-cache-folder
        with:
          path: .cache
          key: ${{ runner.os }}-cache-gatsby-node22-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-cache-gatsby-node22-main

      # public/ is ~3.9 GB: one entry per PR filled the 10 GB quota and evicted main's, which is the one every PR reads
      - name: Gatsby Public Folder
        uses: actions/cache/restore@v5
        id: gatsby-public-folder
        with:
          path: public/
          key: ${{ runner.os }}-public-gatsby-node22-${{ github.ref_name }}
          restore-keys: |
            ${{ runner.os }}-public-gatsby-node22-main

      - run: npm install --prefer-offline --no-audit --fund=false
      - run: GATSBY_HF_CDN_URL="" npm run build
        env:
          # Gatsby defaults to physical cores, which is half the vCPUs of a runner
          GATSBY_CPU_COUNT: logical_cores

      - name: Install Netlify
        run: npm install netlify-cli@17.23.2 -g

      - name: Deploy to Netlify Preview
        run: |
          netlify deploy \
            --dir public \
            --site ${{ secrets.NETLIFY_SITE_ID }} \
            --auth ${{ secrets.NETLIFY_AUTH_TOKEN }} \
            --json \
            > deploy_output.json

      - name: Generate URL Preview
        id: url_preview
        run: |
          NETLIFY_PREVIEW_URL=$(jq -r '.deploy_url' deploy_output.json)
          echo "NETLIFY_PREVIEW_URL=$NETLIFY_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Create PR Preview Comment
        if: steps.deploy-preview-comment.outputs.comment-id == 0
        uses: peter-evans/create-or-update-comment@v5
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Preview Deployment
            🚀 Preview this PR: ${{ steps.url_preview.outputs.NETLIFY_PREVIEW_URL }}
            📍 Commit SHA: ${{ github.sha }}

      - name: Update PR Preview Comment
        if: steps.deploy-preview-comment.outputs.comment-id != 0
        uses: peter-evans/create-or-update-comment@v5
        with:
          comment-id: ${{ steps.deploy-preview-comment.outputs.comment-id }}
          edit-mode: replace
          body: |
            ## Preview Deployment
            🚀 Preview this PR: ${{ steps.url_preview.outputs.NETLIFY_PREVIEW_URL }}
            📍 Commit SHA: ${{ github.sha }}
