name: Validate Content

on:
  repository_dispatch:
    types: deploy
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  spell_check:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run spell check
        run: |
          pip install codespell==2.3.0
          # Localized datasheets are written in their own language, which an English dictionary flags
          # word by word. English datasheets (datasheet.md / en-datasheet.md) are still checked.
          codespell -I "scripts/resources/spell-check-ignore-list.txt" --skip="*.svg,*.dxf,*.pdf,*de-datasheet.md,*es-datasheet.md,*fr-datasheet.md,*hi-datasheet.md,*it-datasheet.md,*ja-datasheet.md,*nl-datasheet.md,*pt-datasheet.md,*zh-datasheet.md" ./content/

  lint:
    name: Content Linter
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version: [14]

    steps:
      - uses: actions/checkout@v4

      - name: Run linter
        run: |
          cd scripts/validation
          ./content-lint.sh -p '../../content/hardware/'

  validate_markdown:
    name: Markdown Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Markdown
        run: python3 scripts/validation/markdown_lint/markdown_lint.py content

  validate_alerts:
    name: Alert Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Alerts
        run: python3 scripts/validation/alert_tags/alert_tags.py validate content

  validate_links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Links
        run: python3 scripts/validation/relative_links/relative_links.py validate content

  validate_images:
    name: Image Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Images
        run: python3 scripts/validation/image_links/image_links.py validate content
