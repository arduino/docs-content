name: Remove Preview Label

# A new push drops the label, so a preview only runs when the label is added again
on:
  # Fork PRs get a read-only token on pull_request; this is safe only while no PR code is checked out
  pull_request_target:
    types: [synchronize]

permissions:
  pull-requests: write

jobs:
  remove-label:
    if: contains(github.event.pull_request.labels.*.name, 'preview')
    runs-on: ubuntu-latest
    steps:
      - run: gh pr edit "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
