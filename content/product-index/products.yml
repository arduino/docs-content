# One entry per product. The key is the product name without "Arduino", written like the folder names in docs-content/hardware
# (lowercase, hyphens instead of spaces), and it never changes once it is in use.
# Name: the full product name, with "Arduino" and without trademark symbols.
# SKU: the SKU of the product.
# Status: Active, Not recommended for new designs, Declared End of Life or Discontinued.
# Dates: YYYY-MM-DD. Leave a field empty, or write "-" with the quotes, when there is no value.
# Replacement: the folder name of the replacement product in docs-content/hardware, e.g. nano-esp32. It links to that product page.
# Bulletin: the name of a folder in tutorials/bulletin.
# Whatever the Status says, the page shows Declared End of Life from the End of Life date, and Discontinued once End of Sales has passed.

